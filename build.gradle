plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group = 'com.mochi_753.mekanismdelight'
version = '1.1.3-dimensionworks.1'
base.archivesName = 'mekanismdelight'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
neoForge {
    enable { version = '21.1.267'; disableRecompilation = true }
    mods { mekanismdelight { sourceSet sourceSets.main } }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { gameDirectory = file('run'); jvmArguments.addAll('-Xmx2G','-XX:ActiveProcessorCount=2') }
    }
}
dependencies {
    implementation 'maven.modrinth:mekanism:5KzzycBT'
    implementation 'maven.modrinth:mekanism-generators:a6gl7srE'
    implementation 'maven.modrinth:farmers-delight:XTVZDOol'
}
sourceSets.main.resources.srcDir 'src/generated/resources'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { archiveFileName = "mekanismdelight-1.21.1-${version}.jar"; preserveFileTimestamps = false; reproducibleFileOrder = true; from('LICENSE') }
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    mods { mekanismdelight { sourceSet sourceSets.gameTest } }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mekanismdelight'
        }
    }
}
tasks.named('runGameTestServer') {
    def log = file('run-gametest/logs/latest.log')
    doFirst { log.delete(); file('run-gametest').mkdirs(); file('run-gametest/server.properties').text = 'server-ip=127.0.0.1\nserver-port=25576\nonline-mode=false\nview-distance=2\nsimulation-distance=5\n' }
    doLast { if (!log.exists() || !log.text.contains('All 6 required tests passed')) throw new GradleException('Native Mekanism Delight GameTests did not pass') }
}
